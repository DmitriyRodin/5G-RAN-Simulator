syntax = "proto3";

package ran.protocol;

message PlmnIdentity {
    uint32 mcc = 1;
    uint32 mnc = 2;
}

message RrcSetupRequest {
    uint64 ue_identity = 1;
    uint32 cause = 2;
}

message RachPreambleInfo {
    uint32 ra_rnti = 1;
}

message RarInfo {
    uint32 ra_rnti = 1;
    uint32 temp_c_rnti = 2;
    uint32 timing_advance = 3;
}

message RrcSetupInfo {
    uint64 received_identity = 1;
    uint32 config_status = 2;
}

message RrcSetupCompleteInfo {
    PlmnIdentity plmn = 1;
}

message RegistrationRequestInfo {
    uint32 ue_id = 1;
    string ue_cap = 2;
}

message RegistrationAnswerInfo {
    uint32 status = 1;
    optional string reject_reason = 2;
}

message MeasurementReportInfo {
    uint32 reported_gnb_id = 1;
    double rsrp = 2;
}

message RrcReconfigurationInfo {
    uint32 target_gnb_id = 1;
}

message ChatMessageInfo {
    uint32 receiver_ue_id = 1;
    uint32 sender_ue_id = 2;
    string text = 3;
}

message RachConfigCommon {
    uint32 total_number_of_RA_preambles = 1;
    uint32 preamble_trans_max = 2;
    uint32 ra_response_window_ms = 3;
}

message SibMapping {
    uint32 sib_type = 1;
    uint32 periodicity_ms = 2;
}

message SiSchedulingInfo {
    uint32 si_window_length_ms = 1;
    uint32 system_info_value_tag = 2;
    repeated SibMapping scheduled_sibs = 3;
}

message SIB1Info {
    uint32 cell_identity = 1;
    uint32 tac = 2;
    int32 qRx_lev_min = 3;
    bool cell_barred = 4;
    bool reserved_for_operator_use = 5;
    bool intra_freq_reselection = 6;
    RachConfigCommon rach_config = 7;
    SiSchedulingInfo si_scheduling = 8;
    repeated PlmnIdentity plmn_identity_info_list = 9;
}

message HandoverInfo {
    uint32 gnb_id = 1;
}

message HubRegistrationPayload {
    double radius = 1;
}

message HubRegistrationResponse {
    uint32 status = 1;
}
